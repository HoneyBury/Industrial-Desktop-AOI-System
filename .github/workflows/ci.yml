name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure quick CI build
        run: >
          cmake --preset default
          -DAOI_ENABLE_GUI=OFF
          -DAOI_ENABLE_OPENCV=OFF
          -DAOI_ENABLE_SQLITE=OFF
          -DAOI_FETCH_GTEST=OFF

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default

      - name: clang-tidy
        run: cmake --build build/default --target aoi_clang_tidy || true
