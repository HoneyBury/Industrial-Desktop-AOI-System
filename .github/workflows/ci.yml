name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Homebrew environment
        shell: bash
        run: |
          if [[ -x /opt/homebrew/bin/brew ]]; then
            echo "BREW_BIN=/opt/homebrew/bin/brew" >> "$GITHUB_ENV"
            echo "BREW_PREFIX=/opt/homebrew" >> "$GITHUB_ENV"
            echo "BREW_ARCH=arm64" >> "$GITHUB_ENV"
          else
            echo "BREW_BIN=/usr/local/bin/brew" >> "$GITHUB_ENV"
            echo "BREW_PREFIX=/usr/local" >> "$GITHUB_ENV"
            echo "BREW_ARCH=x86_64" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "$BREW_ARCH" == "arm64" ]]; then
            arch -arm64 "$BREW_BIN" update
            arch -arm64 "$BREW_BIN" install ninja qt opencv llvm
          else
            "$BREW_BIN" update
            "$BREW_BIN" install ninja qt opencv llvm
          fi

      - name: Export toolchain paths
        shell: bash
        run: |
          echo "PATH=$BREW_PREFIX/opt/qt/bin:$BREW_PREFIX/opt/llvm/bin:$PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX/opt/qt:$BREW_PREFIX/opt/opencv:$BREW_PREFIX/opt/llvm" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset default -DAOI_FETCH_GTEST=ON

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default

      - name: clang-tidy
        run: cmake --build build/default --target aoi_clang_tidy || true
