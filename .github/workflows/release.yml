name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package-macos-demo:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Homebrew environment
        shell: bash
        run: |
          if [[ -x /opt/homebrew/bin/brew ]]; then
            echo "BREW_BIN=/opt/homebrew/bin/brew" >> "$GITHUB_ENV"
            echo "BREW_PREFIX=/opt/homebrew" >> "$GITHUB_ENV"
            echo "BREW_ARCH=arm64" >> "$GITHUB_ENV"
          else
            echo "BREW_BIN=/usr/local/bin/brew" >> "$GITHUB_ENV"
            echo "BREW_PREFIX=/usr/local" >> "$GITHUB_ENV"
            echo "BREW_ARCH=x86_64" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "$BREW_ARCH" == "arm64" ]]; then
            arch -arm64 "$BREW_BIN" update
            arch -arm64 "$BREW_BIN" install ninja qt opencv
          else
            "$BREW_BIN" update
            "$BREW_BIN" install ninja qt opencv
          fi

      - name: Export toolchain paths
        shell: bash
        run: |
          echo "PATH=$BREW_PREFIX/opt/qt/bin:$PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX/opt/qt:$BREW_PREFIX/opt/opencv" >> "$GITHUB_ENV"

      - name: Configure Release
        run: cmake --preset release -DAOI_FETCH_GTEST=ON

      - name: Build Release
        run: cmake --build --preset release --parallel

      - name: Package artifact
        run: |
          mkdir -p dist
          cp build/release/industrial_desktop_aoi dist/
          tar -czf industrial-desktop-aoi-macos-demo.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: industrial-desktop-aoi-macos-demo
          path: industrial-desktop-aoi-macos-demo.tar.gz
